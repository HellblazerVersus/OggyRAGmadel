[project]
name = "voice-rag-hhgoa"
version = "0.2.0"
description = "Voice-Enabled RAG core scaffold for Indic languages (HH Goa 2026, Task #2)"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "torch>=2.0.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "faiss-cpu>=1.8.0",
    "faster-whisper>=1.0.0",
    "datasets>=2.19.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
    "pytest>=8.0.0",
    "sounddevice>=0.5.6",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sarvamai>=0.0.10",
    "elevenlabs>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "accelerate>=0.28.0",
    "nvidia-cudnn-cu12>=9.0.0",
    "nvidia-cublas-cu12>=12.0.0",
    "nvidia-cuda-nvrtc-cu12>=12.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
